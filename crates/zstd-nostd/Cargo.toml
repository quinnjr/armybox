[package]
name = "zstd-nostd"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Joseph R. Quinn <quinn.josephr@protonmail.com>"]
description = "Pure Rust no_std Zstandard (zstd) compression and decompression"
repository = "https://github.com/quinnjr/armybox"
homepage = "https://github.com/quinnjr/armybox"
license = "MIT OR Apache-2.0"
keywords = ["zstd", "zstandard", "compression", "no_std", "embedded"]
categories = ["compression", "no-std", "embedded"]
readme = "README.md"

[features]
default = ["alloc"]
alloc = []

[dev-dependencies]
ruzstd = "0.8.2"
