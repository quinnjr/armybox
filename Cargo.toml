# --- Package manager ---
apk = ["alloc"]    # Alpine Package Keeper (APK) package manager
abp = ["alloc", "dep:abp"]  # Armybox Package Manager (ABP)

[dependencies]
# Core dependency - provides syscall interface
libc = "0.2"
abp = { version = "0.2.1", path = "crates/abp", optional = true, default-features = false, features = ["alloc"] }
zstd-nostd = { version = "0.2.0", path = "crates/zstd-nostd", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
# For testing only - benchmarks are in crates/benchmarks
tempfile = "3"
proptest = "1"

# Benchmark profile
[profile.bench]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false

# Don't use panic=abort for dev profile to allow tests
[profile.dev]
panic = "unwind"

[[bin]]
name = "armybox"
path = "src/main.rs"
test = false  # Binary uses no_std/no_main, can't be tested directly
